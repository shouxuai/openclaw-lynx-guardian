你是一位研发总监，请写一个概要设计书。产品内部代号Lynx-猞猁（openclaw安全围栏，注：openclaw是当前最火的Agent智能体），智能体安全产品。猞猁——以敏锐视觉著称，象征对风险的“高分辨率感知”，多维识别智能体威胁，重塑 Agent 安全边界。
产品形态：openclaw插件（前端）+Python后端+大模型系统
产品架构：
1、前端层：openclaw插件，负责与用户交互，展示产品功能。
2、后端层：Python后端，负责处理业务逻辑、数据存储、与大模型系统交互。
3、大模型系统层：负责智能体威胁识别、风险评估、安全建议等功能，包含裁判大模型（自研）、通用大模型（qwen3.5-plus、deepseek-v3.2）。
业务架构：
1、安装：用户通过输入“请帮我为openclaw安装这个安全插件：github链接”，openclaw插件会从github上下载插件代码，并安装到openclaw中。
2、使用：安装完成后，默认开启插件。插件会生成一个唯一的用户ID。
3、功能：
1）智能体威胁识别：插件会监控openclaw中的所有智能体活动，识别潜在的威胁。分为两类判断：1、基于Agent大模型输入、输出，远程调用服务端的裁判大模型判断其是否存在高危意图（如执行恐怖主义）。
    2、基于工具调用识别，判断其是否调用了高危工具（如执行rm -rf）。
2）风险评估：根据识别的结果，评估智能体可能面临的风险（无风险、低危风险、中危风险、高危风险）。
3）安全介入：根据风险评估结果，提供低风险安全建议、中风险给用户确认、高风险拦截，帮助用户采取措施保护智能体。
4、VIP功能：普通用户只能使用基础功能，如裁判大模型的判断次数受限（免费用户10次/天）。
    1）专业版：提供更多功能，如自定义风险评估模型、24/7 监控、24/7 客服支持等。
功能设计：
1、客户端（插件）
技术栈：nodejs
1）用户注册：插件安装后，检测缓存目录(~/.openclaw/lynx)是否存在，如果不存在，创建并自动生成一个18位的用户ID（ID+时间戳+随机数），并存储到缓存目录中。
2）用户登录：读取已存在的用户ID，发送到Python后端，如果ID不存在，则创建新账号并登录，本系统没有真正意义的登录。
3）Agent输入输出检测：插件会监控openclaw中的所有智能体活动，当智能体输入或输出时，会将其发送到Python后端，后端会调用裁判大模型判断其是否存在高危意图。
    挂载在openclaw的智能体输入（before_agent_start）、输出事件（agent_end）中，当事件触发时，插件会将事件数据发送到Python后端。
4）工具调用检测：插件会监控openclaw中的所有智能体活动，当智能体调用工具时，插件会将其发送到Python后端，后端会调用通用大模型判断其是否调用了高危工具。
    另外，插件本地具有一个工具调用黑名单，当智能体调用黑名单中的工具时，插件会直接拦截，不发送到Python后端。挂载在openclaw的智能体调用工具事件（before_tool_call）中，当事件触发时，插件会判断工具是否在黑名单中，如果在，直接拦截。
5）风险评估：根据识别的结果，评估智能体可能面临的风险（无风险、低危风险、中危风险、高危风险）。
6）安全介入：根据风险评估结果，提供低风险安全建议、中风险给用户确认、高风险拦截，帮助用户采取措施保护智能体。

2、后端（Python）
技术栈：fastapi
1）用户管理：用户注册、权限验证。目前没有会员管理系统，用户线下或线上汇款后，手动把权限添加到数据库中
2）智能体监控：接收前端发送的智能体活动数据，存储到数据库中，需要根据用户ID进行分类存储。
3）大模型调用：调用裁判大模型、通用大模型，判断智能体意图、工具调用是否存在高危风险，需要根据用户是否是会员进行判定，普通用户每天只能调用10次。
4）风险评估：根据大模型判断结果，评估智能体可能面临的风险。
5）安全建议：根据风险评估结果，提供安全建议。

3、大模型系统
技术栈：python、vllm、qwen3.5-plus、deepseek-v3.2、自研大模型
1）裁判大模型：自研，用于判断智能体意图是否存在高危风险。
2）通用大模型：qwen3.5-plus、deepseek-v3.2，用于判断智能体调用的工具是否存在高危风险。
接口设计：
1、用户注册接口
/api/v1/register
【前后端接口】
POST
请求：{
    "id": "string"
}
返回：{
    "code": 200,
    "id": "string",
    "message": "注册成功"
}
2、智能体活动（输入输出）检测接口
/api/v1/agent_check
【前后端接口】
POST
请求：{
    "id": "string",
    "content": "string",
}
返回：{
    "code": 200,
    "result": {
        "is_safe": true,
        "content": "请注意，内容包含儿童色情内容，需要进行价值观正向引导……"
    },
    "message": ""
}
3、工具调用检测接口
/api/v1/tool_check
【前后端接口】
POST
请求：{
    "id": "string",
    "content": "rm -rf /*",
}
返回：{
    "code": 200,
    "result": {
        "is_safe": false,
        "content": ""
    },
    "message": ""
}
4、裁判大模型调用接口
/api/v1/cp
【内部接口】
POST
请求：{
    "prompt": "这是裁判大模型，用来识别内容是否包含违规内容，如涉黄、涉政、涉暴等。",
}
返回：{
    "is_safe": "安全",
    "level_one": "其他",
    "level_two": "None",
    "level_three": "None"
}
5、通用大模型调用接口
/api/v1/gt
【内部接口】
POST
请求：{
    "model": "deepseek-v3.2",
    "messages": [
        {
            "role": "user",
            "content": "这是通用大模型，执行特定的功能，比如，识别恶意代码"
        }
    ]
}
返回：{
    "is_safe": "安全"
}
6、后端查询接口
/api/v1/query
【内部接口】
POST
请求：{
    "id": "string", # 可选参数，如果不传，默认查询所有用户
}
返回：{
    "code": 200,
    "data": [
        {
            "id": "string",
            "content": "string",
            "is_safe": true,
            "level_one": "其他",
            "level_two": "None",
            "level_three": "None",
            "cp_result": {
                "is_safe": "安全",
                "level_one": "其他",
                "level_two": "None",
                "level_three": "None"
            },
            "gt_result": {
                "is_safe": "安全"
            }
        }
    ],
    "message": ""
}
7、后端统计接口
/api/v1/statistics
【内部接口】
POST
请求：{
    "id": "string", # 可选参数，如果不传，默认查询所有用户
}
返回：{
    "code": 200,
    "data": {
        "total": 100, # 总记录数
        "safe": 80, # 安全记录数
        "unsafe": 20, # 非安全记录数
    },
    "message": ""
}
