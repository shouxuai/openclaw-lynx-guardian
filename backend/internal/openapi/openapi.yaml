openapi: 3.0.3
info:
  title: Lynx Server API
  version: 0.1.0
  description: Local Lynx Guardian backend API served by the Gin-based lynx-server binary.
servers:
  - url: http://127.0.0.1:31789
    description: Default local lynx-server
tags:
  - name: meta
    description: Server health and capability metadata.
  - name: query
    description: Local audit, approval, session, check, dashboard, and token query APIs.
  - name: ingest
    description: Internal authenticated ingestion API used by the plugin runtime.
paths:
  /lynx/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Read server health.
      responses:
        "200":
          description: Server health payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /lynx/meta/capabilities:
    get:
      tags: [meta]
      operationId: getCapabilities
      summary: Read local console capabilities.
      responses:
        "200":
          description: Capability flags and query API version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
  /lynx/policies:
    get:
      tags: [query]
      operationId: getPolicies
      summary: Read policy rules, protected resources, and current policy version.
      responses:
        "200":
          $ref: "#/components/responses/ObjectResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/protected-resources:
    post:
      tags: [query]
      operationId: upsertProtectedResource
      summary: Create or update one protected resource policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/ObjectResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/policy-rules:
    post:
      tags: [query]
      operationId: upsertPolicyRule
      summary: Create or update one user-managed policy rule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/ObjectResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/events:
    get:
      tags: [query]
      operationId: listEvents
      summary: List audit events.
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/FromMs"
        - $ref: "#/components/parameters/ToMs"
        - $ref: "#/components/parameters/SessionKey"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RiskLevel"
        - $ref: "#/components/parameters/EnforcementAction"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/HookName"
        - $ref: "#/components/parameters/EventType"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/SubCategory"
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/PrimaryModule"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ToolCallId"
        - $ref: "#/components/parameters/ApprovalId"
        - name: includeRoutineHeartbeat
          in: query
          schema:
            type: boolean
      responses:
        "200":
          $ref: "#/components/responses/PageResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/events/{eventId}:
    get:
      tags: [query]
      operationId: getEvent
      summary: Read one audit event.
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ObjectResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/tool-calls:
    get:
      tags: [query]
      operationId: listToolCalls
      summary: List tool calls.
      parameters:
        - $ref: "#/components/parameters/FromMs"
        - $ref: "#/components/parameters/ToMs"
        - $ref: "#/components/parameters/SessionKey"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RiskLevel"
        - $ref: "#/components/parameters/EnforcementAction"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/ToolName"
        - name: resultStatus
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          $ref: "#/components/responses/PageResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/tool-calls/{toolCallId}:
    get:
      tags: [query]
      operationId: getToolCall
      summary: Read one tool call.
      parameters:
        - name: toolCallId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ObjectResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/approvals:
    get:
      tags: [query]
      operationId: listApprovals
      summary: List approval records.
      parameters:
        - $ref: "#/components/parameters/FromMs"
        - $ref: "#/components/parameters/ToMs"
        - $ref: "#/components/parameters/SessionKey"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RiskLevel"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: resolution
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/ToolName"
        - name: module
          in: query
          schema:
            type: string
        - name: scopeType
          in: query
          schema:
            type: string
        - name: requesterOuId
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/PageResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/approvals/{approvalId}:
    get:
      tags: [query]
      operationId: getApproval
      summary: Read one approval record.
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ObjectResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/approvals/{approvalId}/resolve:
    post:
      tags: [query]
      operationId: resolveApproval
      summary: Resolve one approval record.
      description: Allows a still-pending non-L4 approval from the local console helper view and records the approval result. L4 hard-deny records cannot be approved from this endpoint.
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalResolveRequest"
      responses:
        "200":
          $ref: "#/components/responses/ObjectResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/lynx-checks:
    get:
      tags: [query]
      operationId: listLynxChecks
      summary: List Lynx check runs.
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/FromMs"
        - $ref: "#/components/parameters/ToMs"
        - $ref: "#/components/parameters/SessionKey"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: source
          in: query
          schema:
            type: string
        - name: trigger
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: messageProvider
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/PageResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/lynx-checks/{requestId}:
    get:
      tags: [query]
      operationId: getLynxCheck
      summary: Read one Lynx check run.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ObjectResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/sessions:
    get:
      tags: [query]
      operationId: listSessions
      summary: List conversation sessions.
      parameters:
        - $ref: "#/components/parameters/FromMs"
        - $ref: "#/components/parameters/ToMs"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: channelProfile
          in: query
          schema:
            type: string
        - name: channelId
          in: query
          schema:
            type: string
        - name: requesterId
          in: query
          schema:
            type: string
        - name: requesterOuId
          in: query
          schema:
            type: string
        - name: isGroup
          in: query
          schema:
            type: boolean
      responses:
        "200":
          $ref: "#/components/responses/PageResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/sessions/{sessionKey}:
    get:
      tags: [query]
      operationId: getSession
      summary: Read one conversation session.
      parameters:
        - name: sessionKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ObjectResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/dashboard/overview:
    get:
      tags: [query]
      operationId: getDashboardOverview
      summary: Read dashboard overview metrics.
      parameters:
        - $ref: "#/components/parameters/FromMs"
        - $ref: "#/components/parameters/ToMs"
      responses:
        "200":
          $ref: "#/components/responses/ObjectResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/tokens/usage:
    get:
      tags: [query]
      operationId: listTokenUsage
      summary: List token usage records.
      parameters:
        - $ref: "#/components/parameters/FromMs"
        - $ref: "#/components/parameters/ToMs"
        - $ref: "#/components/parameters/SessionKey"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: provider
          in: query
          schema:
            type: string
        - name: model
          in: query
          schema:
            type: string
        - name: agentId
          in: query
          schema:
            type: string
        - name: isEstimated
          in: query
          schema:
            type: boolean
      responses:
        "200":
          $ref: "#/components/responses/PageResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/tokens/summary:
    get:
      tags: [query]
      operationId: getTokenSummary
      summary: Read token usage summary.
      parameters:
        - $ref: "#/components/parameters/FromMs"
        - $ref: "#/components/parameters/ToMs"
        - $ref: "#/components/parameters/SessionKey"
        - $ref: "#/components/parameters/RunId"
        - name: provider
          in: query
          schema:
            type: string
        - name: model
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ObjectResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/tokens/trend:
    get:
      tags: [query]
      operationId: getTokenTrend
      summary: Read token usage trend.
      parameters:
        - $ref: "#/components/parameters/FromMs"
        - $ref: "#/components/parameters/ToMs"
        - $ref: "#/components/parameters/SessionKey"
        - $ref: "#/components/parameters/RunId"
        - name: provider
          in: query
          schema:
            type: string
        - name: model
          in: query
          schema:
            type: string
        - name: bucket
          in: query
          schema:
            type: string
            enum: [minute, hour, day]
      responses:
        "200":
          $ref: "#/components/responses/ObjectResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/internal/v1/ingest/batch:
    post:
      tags: [ingest]
      operationId: ingestBatch
      summary: Ingest one plugin event batch.
      description: The plugin writes versioned batch intents for sessions, audit events, tool calls, approvals, Lynx checks, and token usage; the backend validates, deduplicates, and persists them into SQLite.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestBatchRequest"
      responses:
        "200":
          description: Batch ingest result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestBatchResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/internal/v1/ingest/audit-events:
    post:
      tags: [ingest]
      operationId: ingestAuditEvents
      summary: Ingest audit event items.
      description: Accepts the same ingest batch envelope as /lynx/internal/v1/ingest/batch, but only auditEvent items are accepted.
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/IngestBatchRequestBody"
      responses:
        "200":
          $ref: "#/components/responses/IngestBatchResult"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/internal/v1/ingest/sessions:
    post:
      tags: [ingest]
      operationId: ingestSessions
      summary: Ingest session upsert items.
      description: Accepts the same ingest batch envelope as /lynx/internal/v1/ingest/batch, but only sessionUpsert items are accepted.
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/IngestBatchRequestBody"
      responses:
        "200":
          $ref: "#/components/responses/IngestBatchResult"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/internal/v1/ingest/tool-calls:
    post:
      tags: [ingest]
      operationId: ingestToolCalls
      summary: Ingest tool call upsert items.
      description: Accepts the same ingest batch envelope as /lynx/internal/v1/ingest/batch, but only toolCallUpsert items are accepted.
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/IngestBatchRequestBody"
      responses:
        "200":
          $ref: "#/components/responses/IngestBatchResult"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/internal/v1/ingest/approvals:
    post:
      tags: [ingest]
      operationId: ingestApprovals
      summary: Ingest approval upsert items.
      description: Accepts the same ingest batch envelope as /lynx/internal/v1/ingest/batch, but only approvalUpsert items are accepted.
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/IngestBatchRequestBody"
      responses:
        "200":
          $ref: "#/components/responses/IngestBatchResult"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/internal/v1/ingest/lynx-checks:
    post:
      tags: [ingest]
      operationId: ingestLynxChecks
      summary: Ingest Lynx check upsert items.
      description: Accepts the same ingest batch envelope as /lynx/internal/v1/ingest/batch, but only lynxCheckUpsert items are accepted.
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/IngestBatchRequestBody"
      responses:
        "200":
          $ref: "#/components/responses/IngestBatchResult"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /lynx/internal/v1/ingest/token-usage:
    post:
      tags: [ingest]
      operationId: ingestTokenUsage
      summary: Ingest token usage items.
      description: Accepts the same ingest batch envelope as /lynx/internal/v1/ingest/batch, but only tokenUsage items are accepted.
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/IngestBatchRequestBody"
      responses:
        "200":
          $ref: "#/components/responses/IngestBatchResult"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  requestBodies:
    IngestBatchRequestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestBatchRequest"
  parameters:
    Q:
      name: q
      in: query
      schema:
        type: string
    FromMs:
      name: fromMs
      in: query
      schema:
        type: integer
        format: int64
    ToMs:
      name: toMs
      in: query
      schema:
        type: integer
        format: int64
    SessionKey:
      name: sessionKey
      in: query
      schema:
        type: string
    RunId:
      name: runId
      in: query
      schema:
        type: string
    RiskLevel:
      name: riskLevel
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    EnforcementAction:
      name: enforcementAction
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    HookName:
      name: hookName
      in: query
      schema:
        type: string
    EventType:
      name: eventType
      in: query
      schema:
        type: string
    Category:
      name: category
      in: query
      schema:
        type: string
    SubCategory:
      name: subCategory
      in: query
      schema:
        type: string
    Direction:
      name: direction
      in: query
      schema:
        type: string
    PrimaryModule:
      name: primaryModule
      in: query
      schema:
        type: string
    RequestId:
      name: requestId
      in: query
      schema:
        type: string
    ToolCallId:
      name: toolCallId
      in: query
      schema:
        type: string
    ApprovalId:
      name: approvalId
      in: query
      schema:
        type: string
    ToolName:
      name: toolName
      in: query
      schema:
        type: string
  responses:
    IngestBatchResult:
      description: Batch ingest result.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestBatchResponse"
    PageResponse:
      description: Cursor-paginated result page.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Page"
    ObjectResponse:
      description: Single JSON object result.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonObject"
    ErrorResponse:
      description: Error payload.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    HealthResponse:
      type: object
      required: [ok, serverTimeMs, schemaVersion]
      properties:
        ok:
          type: boolean
        serverTimeMs:
          type: integer
          format: int64
        schemaVersion:
          type: string
          enum: [lynx-server.ingest.v1]
    CapabilitiesResponse:
      type: object
      required: [tokenUsageEnabled, gatewayAuthLogsEnabled, queryApiVersion]
      properties:
        tokenUsageEnabled:
          type: boolean
        gatewayAuthLogsEnabled:
          type: boolean
        queryApiVersion:
          type: string
          enum: [v1]
    Page:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JsonObject"
        nextCursor:
          type: string
          nullable: true
      additionalProperties: true
    ErrorResponse:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
          enum: [false]
        message:
          type: string
    ApprovalResolveRequest:
      type: object
      properties:
        approvalId:
          type: string
        resolution:
          type: string
          enum: [allow-current-chain, allow-once, allow-always, approved, rejected, denied, blocked, failed]
        chainId:
          type: string
        sessionKey:
          type: string
        channelProfile:
          type: string
        channelId:
          type: string
        conversationId:
          type: string
        requesterId:
          type: string
        requesterOuId:
          type: string
        approverId:
          type: string
        approverOuId:
          type: string
        riskFamily:
          type: string
        riskLevel:
          type: string
          enum: [L0, L1, L2, L3, L4]
        toolName:
          type: string
        targetKind:
          type: string
        targetHash:
          type: string
        resourceScope:
          $ref: "#/components/schemas/JsonObject"
        expiresAt:
          type: string
      additionalProperties: true
    IngestBatchRequest:
      type: object
      required: [schemaVersion, producer, sentAtMs, batchId, items]
      properties:
        schemaVersion:
          type: string
          enum: [lynx-server.ingest.v1]
        producer:
          type: object
          required: [pluginId]
          properties:
            pluginId:
              type: string
          additionalProperties: true
        sentAtMs:
          type: integer
          format: int64
        batchId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/IngestItem"
      additionalProperties: true
    IngestItem:
      type: object
      required: [kind, itemId, occurredAtMs, data]
      properties:
        kind:
          type: string
          enum:
            - auditEvent
            - toolCallUpsert
            - approvalUpsert
            - lynxCheckUpsert
            - sessionUpsert
            - tokenUsage
        itemId:
          type: string
        occurredAtMs:
          type: integer
          format: int64
        data:
          $ref: "#/components/schemas/JsonObject"
      additionalProperties: true
    IngestBatchResponse:
      type: object
      required: [acceptedCount, persistedCount, duplicateCount, rejectedCount]
      properties:
        acceptedCount:
          type: integer
        persistedCount:
          type: integer
        duplicateCount:
          type: integer
        rejectedCount:
          type: integer
        rejectedItems:
          type: array
          items:
            $ref: "#/components/schemas/JsonObject"
      additionalProperties: true
